<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RYR TITAN APEX - SUPERVISIÓN LIVE</title>
  <style>
    :root {
      --bg-main: #060913; --bg-card: #0e1526; --accent-cyan: #00ffcc;
      --accent-red: #ef4444; --accent-blue: #38bdf8;
    }
    body { background: var(--bg-main); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #0b132b; padding: 12px 20px; border-radius: 10px;
      border: 1px solid #1e293b; border-left: 4px solid var(--accent-cyan); margin-bottom: 20px;
    }

    .btn-group { display: flex; gap: 8px; }
    .btn-nav {
      background: #1c2541; color: #fff; border: 1px solid #3a506b;
      padding: 7px 14px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
    }
    .btn-nav:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

    .grid-operators {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px;
    }

    .operator-card {
      background: var(--bg-card); border: 1px solid #1e293b;
      border-radius: 12px; padding: 15px; transition: 0.3s;
    }
    .operator-card.in-breach { border-color: var(--accent-red); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }

    .op-header {
      display: flex; justify-content: space-between; border-bottom: 1px solid #1e293b;
      padding-bottom: 10px; margin-bottom: 12px;
    }

    .profile-row {
      background: #060913; border: 1px solid #1e293b; border-radius: 8px;
      padding: 10px; margin-bottom: 8px;
    }

    .timer-pill {
      display: inline-block; font-size: 10px; font-weight: bold;
      padding: 2px 6px; border-radius: 4px; margin: 2px;
      background: #450a0a; color: #f87171; border: 1px solid #ef4444;
    }

    .stat-badge { font-size: 11px; color: var(--accent-blue); font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div style="font-weight: 900; letter-spacing: 1px; color: var(--accent-cyan);">⚡ RYR TITAN APEX - SUPERVISIÓN LIVE & RENDIMIENTO</div>
  <div class="btn-group">
    <button class="btn-nav">📋 Relevos de Turno</button>
    <button class="btn-nav">📊 Productividad</button>
    <button class="btn-nav" style="color: #fbbf24;">💰 Multas ($10.000)</button>
    <button class="btn-nav">📄 Historial de Chats</button>
    <button class="btn-nav">🛡️ Palabras</button>
  </div>
</header>

<div id="operators-grid" class="grid-operators">
    <!-- Cargando operadores... -->
</div>

<script>
  async function refresh() {
    try {
      const res = await fetch('/api/telemetry/live');
      const data = await res.json();
      const grid = document.getElementById('operators-grid');
      
      if (!data.operators || data.operators.length === 0) {
        grid.innerHTML = '<p style="color: #64748b; padding: 20px;">No hay operadores conectados con la extensión activa...</p>';
        return;
      }

      grid.innerHTML = data.operators.map(op => `
        <div class="operator-card ${op.hasExpiredSlaGlobal ? 'in-breach' : ''}">
          <div class="op-header">
            <span style="font-weight: 800;">👤 ${op.operatorName}</span>
            <span style="font-size: 10px; color: #38bdf8;">${op.shift}</span>
          </div>
          ${op.profiles.map(p => `
            <div class="profile-row">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size: 12px; font-weight: bold; color: var(--accent-cyan);">🎯 ${p.profileName}</span>
                <span class="stat-badge">✉️ ${p.pendingReadLetters} cartas</span>
              </div>
              <div style="margin-top: 8px;">
                ${(p.activeChatTimersList || []).map(t => `
                  <span class="timer-pill" title="Mensaje de ${t.contact}">💬 ${t.contact}: ${t.remaining}s</span>
                `).join('')}
              </div>
            </div>
          `).join('')}
          <div style="text-align:right; font-size:9px; color:#475569; margin-top:5px;">Visto hace ${Math.floor((Date.now() - op.lastSeen)/1000)}s</div>
        </div>
      `).join('');

    } catch (e) { console.error("Error UI:", e); }
  }

  setInterval(refresh, 2000);
  refresh();
</script>
</body>
</html>
