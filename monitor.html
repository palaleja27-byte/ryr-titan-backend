<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RYR TITAN - MONITOR ESTABLE</title>
  <style>
    body { background: #060913; color: #fff; font-family: sans-serif; padding: 20px; }
    header { background: #0b132b; padding: 15px; border-radius: 8px; border-bottom: 2px solid #00ffcc; margin-bottom: 20px; display: flex; justify-content: space-between; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card { background: #0e1526; border: 1px solid #1e293b; border-radius: 10px; padding: 15px; }
    .card.alert { border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #1c2541; color: #00ffcc; }
    .status-alert { color: #ef4444; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight: 900;">⚡ RYR TITAN APEX - SUPERVISIÓN LIVE</div>
    <div id="stats">Cargando...</div>
  </header>
  <div id="operators-grid" class="grid"></div>

  <script>
    async function update() {
      try {
        const res = await fetch('/api/telemetry/live');
        const data = await res.json();
        const grid = document.getElementById('operators-grid');
        grid.innerHTML = data.operators.map(op => `
          <div class="card ${op.hasExpiredSla ? 'alert' : ''}">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <b>👤 ${op.operatorName}</b>
              <span style="font-size:10px;">${op.shift}</span>
            </div>
            <div style="font-size:13px; color:#00ffcc;">🎯 Perfil: ${op.profileName}</div>
            <div style="font-size:12px; margin-top:5px;">✉️ Cartas: ${op.pendingReadLetters}</div>
            ${op.hasExpiredSla ? '<div class="status-alert">🚨 SLA VENCIDO (+2m)</div>' : ''}
            <div style="font-size:9px; color:#475569; margin-top:10px;">Visto hace: ${Math.floor((Date.now()-op.lastSeen)/1000)}s</div>
          </div>
        `).join('');
        document.getElementById('stats').innerText = `Conectados: ${data.operators.length}`;
      } catch (e) {}
    }
    setInterval(update, 2000);
    update();
  </script>
</body>
</html>
